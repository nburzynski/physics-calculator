<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0b1f3a"/>
  <circle cx="32" cy="32" r="30" fill="#0d2347"/>

  <!-- Glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0b1f3a" stop-opacity="0"/>
  </radialGradient>
  <circle cx="32" cy="30" r="18" fill="url(#glow)"/>

  <!-- Orbit 1 -->
  <ellipse cx="32" cy="29" rx="16" ry="6" fill="none" stroke="white" stroke-width="1.2" opacity="0.9"/>
  <!-- Orbit 2 (60 deg) -->
  <ellipse cx="32" cy="29" rx="16" ry="6" fill="none" stroke="white" stroke-width="1.2" opacity="0.9" transform="rotate(60 32 29)"/>
  <!-- Orbit 3 (120 deg) -->
  <ellipse cx="32" cy="29" rx="16" ry="6" fill="none" stroke="white" stroke-width="1.2" opacity="0.9" transform="rotate(120 32 29)"/>

  <!-- Nucleus -->
  <circle cx="32" cy="29" r="3" fill="white"/>

  <!-- Electrons -->
  <circle cx="48" cy="29" r="1.5" fill="white" opacity="0.95"/>
  <circle cx="24" cy="15.5" r="1.5" fill="white" opacity="0.95"/>
  <circle cx="24" cy="42.5" r="1.5" fill="white" opacity="0.95"/>

  <!-- E=hf label -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="white" text-anchor="middle" opacity="0.92" letter-spacing="0.5">E=hf</text>
</svg>
